<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Outer Gold/Emerald Seal Ring -->
  <circle cx="60" cy="60" r="58" fill="#FFFFFF" stroke="#047857" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="53" fill="#F0FDF4" stroke="#10B981" stroke-width="1" stroke-dasharray="3 2"/>
  
  <!-- Left: BPOM RI Seal -->
  <g transform="translate(18, 22)">
    <circle cx="20" cy="20" r="19" fill="#003366"/>
    <circle cx="20" cy="20" r="16" fill="#FFFFFF"/>
    <!-- BPOM stylized emblem -->
    <path d="M20 7 C14 11 12 17 14 24 C15 28 18 31 20 33 C22 31 25 28 26 24 C28 17 26 11 20 7 Z" fill="#003366"/>
    <path d="M20 10 C16 13 15 17 16 22 C17 25 19 27 20 28 C21 27 23 25 24 22 C25 17 24 13 20 10 Z" fill="#10B981"/>
    <circle cx="20" cy="18" r="2.5" fill="#FFFFFF"/>
    <text x="20" y="47" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="900" fill="#003366" text-anchor="middle" letter-spacing="0.5">BPOM RI</text>
  </g>

  <!-- Right: Halal Indonesia Seal -->
  <g transform="translate(62, 22)">
    <circle cx="20" cy="20" r="19" fill="#672970"/>
    <circle cx="20" cy="20" r="16" fill="#FFFFFF"/>
    <!-- Halal Gunungan Shape -->
    <path d="M20 7 C16 12 12 18 12 24 C12 28 15 31 20 31 C25 31 28 28 28 24 C28 18 24 12 20 7 Z" fill="#672970"/>
    <path d="M20 10 C17 14 14 19 14 23 C14 26 17 28 20 28 C23 28 26 26 26 23 C26 19 23 14 20 10 Z" fill="#FFFFFF"/>
    <path d="M20 14 C18.5 17 16.5 20 16.5 22.5 C16.5 24.5 18 25.5 20 25.5 C22 25.5 23.5 24.5 23.5 22.5 C23.5 20 21.5 17 20 14 Z" fill="#672970"/>
    <text x="20" y="47" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" font-weight="900" fill="#672970" text-anchor="middle" letter-spacing="0.5">HALAL</text>
  </g>

  <!-- Bottom Official Verification Ribbon -->
  <rect x="18" y="80" width="84" height="20" rx="10" fill="#047857"/>
  <text x="60" y="93.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="800" fill="#FEF08A" text-anchor="middle" letter-spacing="0.5">100% TERVERIFIKASI</text>
</svg>