<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="boxGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B7056"/>
      <stop offset="100%" stop-color="#1E3E2F"/>
    </linearGradient>
    <filter id="giftShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#1C2822" flood-opacity="0.2"/>
    </filter>
  </defs>

  <circle cx="300" cy="300" r="240" fill="#FAF5EE"/>
  <ellipse cx="300" cy="490" rx="150" ry="20" fill="#D3C9BD" opacity="0.6"/>

  <!-- Gift Box Base -->
  <g filter="url(#giftShadow)">
    <rect x="160" y="240" width="280" height="200" rx="16" fill="url(#boxGrad)"/>
    <rect x="145" y="215" width="310" height="40" rx="10" fill="#264D3B"/>

    <!-- Gold Ribbon -->
    <rect x="280" y="215" width="40" height="225" fill="#E8B87A"/>
    
    <!-- Ribbon Bow Top -->
    <ellipse cx="270" cy="195" rx="35" ry="20" fill="#D97A29" transform="rotate(-20 270 195)"/>
    <ellipse cx="330" cy="195" rx="35" ry="20" fill="#D97A29" transform="rotate(20 330 195)"/>
    <circle cx="300" cy="205" r="16" fill="#F4DEB8"/>

    <!-- Gold Foil Text on Box -->
    <text x="300" y="325" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="16" font-weight="bold" fill="#F4DEB8" text-anchor="middle" letter-spacing="1">FOR THE LITTLE</text>
    <text x="300" y="350" font-family="'Quicksand', Arial, sans-serif" font-size="13" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NEWBORN COMFORT SET</text>
    <text x="300" y="380" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="10" font-weight="600" fill="#A8D5BA" text-anchor="middle">Special Gift Box with Greeting Card</text>
  </g>
</svg>
