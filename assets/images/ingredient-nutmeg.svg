<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <circle cx="100" cy="100" r="90" fill="#FBF3EA"/>
  <!-- Nutmeg Shell -->
  <ellipse cx="100" cy="105" rx="55" ry="60" fill="#7A4E2D"/>
  <ellipse cx="98" cy="103" rx="50" ry="55" fill="#925E37"/>
  <!-- Nutmeg seed interior texture -->
  <path d="M70 85 Q100 70 130 90 Q120 130 90 135 Z" fill="#6A3B1B" opacity="0.6"/>
