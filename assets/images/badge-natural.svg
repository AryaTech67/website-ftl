<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Outer Botanical Seal Ring -->
  <circle cx="60" cy="60" r="58" fill="#FFFFFF" stroke="#047857" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="53" fill="#ECFDF5" stroke="#10B981" stroke-width="1" stroke-dasharray="3 2"/>

  <!-- Outer Circular Label -->
  <path id="natCurveTop" d="M22 60 A38 38 0 0 1 98 60" fill="none"/>
  <path id="natCurveBtm" d="M98 60 A38 38 0 0 1 22 60" fill="none"/>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7" font-weight="900" fill="#065F46" letter-spacing="1.2">
    <textPath href="#natCurveTop" startOffset="50%" text-anchor="middle">100% NATURAL</textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="800" fill="#065F46" letter-spacing="1.2">
    <textPath href="#natCurveBtm" startOffset="50%" text-anchor="middle">BOTANICAL FORMULA</textPath>
  </text>

  <!-- Center Double Leaf Emblems & Dewdrop -->
  <g transform="translate(38, 32)">
    <circle cx="22" cy="24" r="18" fill="#D1FAE5"/>
