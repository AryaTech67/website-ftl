    <path d="M22 14 C17 17 14 24 17 30 C20 34 24 35 27 32 C31 27 30 18 22 14 Z" fill="#10B981"/>
    <!-- Secondary Golden Dewdrop Leaf -->
    <path d="M24 24 C19 24 16 28 17 33 C18 36 21 38 24 37 C28 35 28 29 24 24 Z" fill="#F59E0B"/>
    <!-- Leaf veins -->
    <path d="M19 27 C22 24 25 21 28 16" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>