<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <circle cx="100" cy="100" r="90" fill="#FEF7E6"/>
  <!-- Calendula Petals (Golden Orange) -->
  <g transform="translate(100, 100)">
    <!-- Repeating petals rotated -->
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#F59E0B" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#FBBF24" transform="rotate(30)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#F59E0B" transform="rotate(60)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#FBBF24" transform="rotate(90)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#F59E0B" transform="rotate(120)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#FBBF24" transform="rotate(150)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#F59E0B" transform="rotate(180)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#FBBF24" transform="rotate(210)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#F59E0B" transform="rotate(240)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#FBBF24" transform="rotate(270)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#F59E0B" transform="rotate(300)" />
    <ellipse cx="0" cy="-45" rx="10" ry="26" fill="#FBBF24" transform="rotate(330)" />
    <!-- Flower Center Disc -->
    <circle cx="0" cy="0" r="24" fill="#D97706"/>
    <circle cx="0" cy="0" r="18" fill="#B45309"/>
  </g>
</svg>
