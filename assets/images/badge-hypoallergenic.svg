<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <!-- Outer Medical Seal Ring -->
  <circle cx="60" cy="60" r="58" fill="#FFFFFF" stroke="#047857" stroke-width="2.5"/>
  <circle cx="60" cy="60" r="53" fill="#F0FDF4" stroke="#059669" stroke-width="1" stroke-dasharray="3 2"/>
  
  <!-- Outer Circular Label -->
  <path id="hypoCurveTop" d="M22 60 A38 38 0 0 1 98 60" fill="none"/>
  <path id="hypoCurveBtm" d="M98 60 A38 38 0 0 1 22 60" fill="none"/>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="800" fill="#065F46" letter-spacing="1.2">
    <textPath href="#hypoCurveTop" startOffset="50%" text-anchor="middle">DERMATOLOGICALLY</textPath>
  </text>
  <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="6.5" font-weight="800" fill="#065F46" letter-spacing="1.2">
    <textPath href="#hypoCurveBtm" startOffset="50%" text-anchor="middle">CLINICALLY TESTED</textPath>
  </text>

  <!-- Center Medical Laboratory Shield -->
  <g transform="translate(36, 32)">
    <path d="M24 2 L42 8 C42 28 32 38 24 44 C16 38 6 28 6 8 Z" fill="#047857"/>
    <path d="M24 5 L39 10 C39 27 30 36 24 41 C18 36 9 27 9 10 Z" fill="#FFFFFF"/>
    <!-- Medical Cross with Gentle Leaf -->
    <rect x="21" y="14" width="6" height="18" rx="2" fill="#059669"/>
    <rect x="15" y="20" width="18" height="6" rx="2" fill="#059669"/>
    <!-- Test Verified Checkmark -->
    <circle cx="24" cy="23" r="5" fill="#F59E0B"/>
    <path d="M21.5 23 L23.5 25 L26.5 21" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Stars -->
  <g fill="#F59E0B">
    <polygon points="60,21 61.5,25 65.5,25 62,27.5 63.5,31.5 60,29 56.5,31.5 58,27.5 54.5,25 58.5,25"/>
  </g>
</svg>